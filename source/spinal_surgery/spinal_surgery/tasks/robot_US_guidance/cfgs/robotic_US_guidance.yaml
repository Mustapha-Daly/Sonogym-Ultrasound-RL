robot:
  type: 'kuka'  # 'kuka', fr3
  pos: [0.0, -0.75, 0.5]
  joint_pos: [1.5, -0.1, 0.0, -1.6, 0.0, 1.6, 0.0]

patient:
  pos: [0.2, 0.0, 0.6]
  euler_yxz: [-90.0, 90.0, 0.0]
  id_list: ['s0010'] #['s0015', 's0024', 's0028', 's0029', 's0030'] # ['s0010'] # 's0010', 's0014', 's0015'
  label_res: 0.0015 # m
  target_anatomy: 'liver'

bed:
  pos: [0.0, 0.0, 0.3]
  euler_xyz: [90, 0.0, 90]
  scale: 0.001

motion_planning:
  patient_xz_goal: [150, 170, 0.0]
  use_vertebra_goal: False
  vertebra_to_US_2d_pos: [0.0, 0.0]
  scale: [[5, 5, 0.1]]

observation: 
  3D: False
  mode: 'seg' # 'seg', 'CT', 'US'
  scale: 1.0 # 0.02 for datacollection, 0.1 for learning-based
  scale_net: 0.1
action: 
  mode: 'continuous' # 'discrete', 'continuous'
  scale: [2, 2, 0.1] # [0.00002, 0.00002, 0.0001] # 
  max_action: [4, 4, 0.2]

reward:
  w_pos: 0.03

sim:
  episode_length: 200
  patient_xz_range: [[80, 40, 1.0], [200, 240, 3.0]]
  patient_xz_init_range: [[80, 40, 1.5], [200, 240, 3.5]]
  if_use_ct: False
  ct_range: [-300, 3000]
  us: 'conv'
  vis_us: True
  vis_int: 20
  vis_seg_map: True

probe:   #i added this part
  type: convex          # <<< KEY
  #radius: 60             # mm, typical convex probe
  fan_angle: 60          # degrees (50–90 common)
  depth: 0.16            # mm (matches image height)

if_record_traj: True
record_path: /recordings/robot_US_guidance/
