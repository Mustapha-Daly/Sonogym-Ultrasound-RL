robot:
  type: 'kuka'  # 'kuka', fr3
  pos: [0.0, -0.75, 0.5]
  joint_pos: [1.5, -0.1, 0.0, -1.6, 0.0, 1.6, 0.0]

patient:
  id_list: ['s0004']  # change only this id; per-patient pose/ranges live in patient_profiles.yaml
  label_res: 0.0015 # m
  target_anatomy: 'liver'

bed:
  pos: [0.0, 0.0, 0.3]
  euler_xyz: [90, 0.0, 90]
  scale: 0.001

motion_planning:
  patient_xz_goal: [173.42, 221.67, -0.7125] #without bones: [173.42, 221.67, -0.7125] and roll= -0.7000 with bones: [[210, 270, 0.0] and roll =0.0
  #Optimal:_x=239.09, current_z=219.62, current_angle=-0.0063, current_roll=-0.1125
  use_vertebra_goal: False
  vertebra_to_US_2d_pos: [0.0, 0.0] 
  scale: [[5, 5, 0.1]]
  max_roll_adj: 0.6
  roll_init: 0.0

observation: 
  3D: False
  mode: 'seg' # 'seg', 'CT', 'US'
  scale: 0.1 # 0.02 for datacollection, 0.1 for learning-based
  scale_net: 0.1
action: 
  mode: 'continuous' # 'discrete', 'continuous'
  scale: [3, 3, 0.5, 0.5] #instead of [2, 2, 0.25, 0.15] — angle & roll finer for stable orientation/coverage
  max_action: [4, 4, 0.2, 0.4] #instead of [4, 4, 0.2, 0.3]

reward:
  w_coverage: 4.0 # was 1.0 — coverage (rc up to 0.8) not drowned by terminal bonus
  shadow_thresh: 0.20
  alpha1: 0.00 # instead of 0.5
  alpha2: 0.00 # instead of 0.1
  attenuation_Rc: 100.0 # instead of 30
  terminal_bonus_kend: 20.0  #  high reward on task success
  time_penalty: 0.02  # was 0.05 → 720×0.02=14.4 < terminal 20
  alpha_vis: 2.5  # rv weight (visibility → dwell on target); raised 2.0→2.5 so partial glimpses beat the sweep pull
  liver_frac_thresh: 0.15  # was 0.25 (unreachable — liver_frac maxed ~0.36)
  liver_penalty_k: 0.25  # graded liver penalty scale: 0 in-liver → 0.1 fully outside
  w_explore: 0.2  # visitation bonus per NEW (x,z) cell/episode 
  explore_cell_size: 5.0  # voxels per exploration grid cell
  explore_decay: 100  # steps before a visited cell is rewardable again

target_volume:
  enabled: True
  center_voxel: [206, 175, 226]  # only Y=175 (depth) used when randomize: True; X/Z are overridden
  radius_mm: 15  # 15mm / 1.5mm per vox = 10 voxels radius → ~4169 voxels
  label_id: 200
  randomize: True
  liver_x_range: [131, 235]  # actual liver X: 116–250, minus 15 vox safe margin each side
  liver_z_range: [162, 279]  # actual liver Z: 147–294, minus 15 vox safe margin each side
  #chose this range to avoid the liver edges and bones, and to avoid the liver being too close to the US probe at the start of the episode

sim:
  episode_length: 30 #ep_length in seconds → 12s × 60steps/s = 720 agent steps/episode
  patient_xz_range: [[131, 162, -1.5], [235, 279, 1.5]]  # liver bounds ±10 vox margin
  patient_xz_init_range: [[160, 232, 1.5], [160, 232, 1.5]]  # ± 10 vox init range
  #patient_xz_init_range: [[220, 162, -0.5], [235, 279, 0.5]]  #this is the range for randomized initial probe position, which is ± 20 voxels from the liver center. The liver center is at (x=203, z=168), so the range is x: 183–223, z: 148–188. This ensures that the probe starts within a reasonable distance from the liver and avoids starting too close to the edges of the liver or bones.
  #  patient_xz_range: [[125, 152, -0.5], [245, 289, 0.5]]  # liver bounds ±10 vox margin

  # Liver: X range : 116 – 250 Z range : 147 – 294
  #good liver view: x 203 z 168

  if_use_ct: False
  ct_range: [-300, 3000]
  us: 'conv'
  vis_us: True  # True only for debugging during training
  vis_int: 20
  vis_seg_map: False


if_record_traj: False
record_path: /recordings/robot_US_guidance/
