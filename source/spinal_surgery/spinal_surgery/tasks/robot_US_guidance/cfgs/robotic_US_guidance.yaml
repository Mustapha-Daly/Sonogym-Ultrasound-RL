robot:
  type: 'kuka'  # 'kuka', fr3
  pos: [0.0, -0.75, 0.5]
  joint_pos: [1.5, -0.1, 0.0, -1.6, 0.0, 1.6, 0.0]

patient:
  pos: [0.35, 0.15, 0.6]
  euler_yxz: [-90.0, 90.0, 0.0]
  id_list: ['s0030'] #['s0015', 's0024', 's0028', 's0029', 's0030'] # ['s0010'] # 's0010', 's0014', 's0015'
  label_res: 0.0015 # m
  target_anatomy: 'liver'

bed:
  pos: [0.0, 0.0, 0.3]
  euler_xyz: [90, 0.0, 90]
  scale: 0.001

motion_planning:
  patient_xz_goal: [173.42, 221.67, -0.7125] #without bones: [173.42, 221.67, -0.7125] and roll= -0.7000 with bones: [[210, 270, 0.0] and roll =0.0
  #Optimal:_x=239.09, current_z=219.62, current_angle=-0.0063, current_roll=-0.1125
  use_vertebra_goal: False
  vertebra_to_US_2d_pos: [0.0, 0.0]
  scale: [[5, 5, 0.1]]
  max_roll_adj: 0.7
  roll_init: -0.1125

observation: 
  3D: False
  mode: 'seg' # 'seg', 'CT', 'US'
  scale: 0.1 # 0.02 for datacollection, 0.1 for learning-based
  scale_net: 0.1
action: 
  mode: 'continuous' # 'discrete', 'continuous'
  scale: [2, 2, 0.25, 0.15]
  max_action: [4, 4, 0.5, 0.3]

reward:
  w_pos: 0.0
  w_liver: 1.0
  w_bone: 0.5
  w_progress: 3.0

target_volume:
  enabled: True
  center_voxel: [206, 175, 226]   # from teleop pick, image-center frac (0.5,0.5) at confirmed intercostal pose
  radius_mm: 15
  label_id: 200


sim:
  episode_length: 100 #ep_length/ dt* decimation (1/120 *2) in seconds
  patient_xz_range: [[140, 80, -0.5], [280, 340, 0.5]]
  patient_xz_init_range: [[239.09, 219.62, -0.0063], [239.09, 219.62, -0.0063]]

  if_use_ct: False
  ct_range: [-300, 3000]
  us: 'conv'
  vis_us: False  # True only for debfugging during training
  vis_int: 20
  vis_seg_map: True # True only for debugging during training


if_record_traj: False
record_path: /recordings/robot_US_guidance/
